[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "bearing_faults"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "gapapadouli" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
    "numpy",
    "seaborn",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "pyWavelets"
]
requires-python = "~=3.11.7"


[tool.ruff]
line-length = 99
src = ["bearing_faults"]
include = ["pyproject.toml", "bearing_faults/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["bearing_faults"]
force-sort-within-sections = true

